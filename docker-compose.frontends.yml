services:
  buyer:
    build:
      context: ./buyer-app
      args:
        - VITE_API_URL=/api
    image: marketplace-buyer:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  seller:
    build:
      context: ./seller-app
      args:
        - VITE_API_URL=/api
    image: marketplace-seller:latest
    ports:
      - "8081:80"
    restart: unless-stopped
